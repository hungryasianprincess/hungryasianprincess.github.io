<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', sans-serif; /* default body font */
      background: url('https://via.placeholder.com/1920x1080') no-repeat center center/cover;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background: rgba(0,0,0,0.5); /* Optional overlay for readability */
      padding: 40px 20px;
      border-radius: 10px;
    }

    /* Subheading */
    .subheading {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 1.2rem;
      color: #facc15; /* yellow */
      margin-bottom: 0.5rem;
    }

    /* Main heading */
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    /* Body paragraph */
    p {
      font-family: 'Open Sans', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Email icon and Notify Me */
    .email-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .email-section a {
      color: #facc15;
      text-decoration: none;
      font-size: 1.5rem;
    }

    .notify-btn {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #facc15; /* yellow */
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
    }

    .notify-btn:hover {
      background-color: #eab308;
    }

    @media(max-width: 480px){
      h1 { font-size: 2.2rem; }
      .subheading { font-size: 1rem; }
      p { font-size: 0.95rem; }
    }
  </style>
</head>
