<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Use Archive - Coming Soon</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url('https://images.pexels.com/photos/10752025/pexels-photo-10752025.jpeg') no-repeat center center;
      background-size: cover;
      color: #FFFFFF;
      padding: 20px;
      position: relative;
    }

    /* Dark overlay for text readability */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
    }

    .site-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      color: #FFF500;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .coming-soon {
      font-family: 'Oswald', sans-serif;
      font-size: 5.5rem;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .description {
      font-family: 'Open Sans', sans-serif;
      font-size: 1rem;
      color: #FFFFFF;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Unicode email symbol */
    .email-link {
      color: #FFF500;
      font-size: 2rem;
      text-decoration: none;
      transition: color 0.3s;
    }

    .email-link:hover {
      color: #e6e600;
    }

    @media (max-width: 768px) {
      .coming-soon {
        font-size: 3.5rem;
      }

      .site-name, .description {
        font-size: 1rem;
      }

      .email-link {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="site-name">afterusearchive.org</div>
    <div class="coming-soon">coming soon</div>
    <p class="description">
      After Use is a digital archive that serves to spotlight the voices of people in recovery by providing a voluntary space for storytelling to represent the social contexts of substance use and recovery.
    </p>
    <a href="mailto:madbrad38@gmail.com" class="email-link">✉️</a>
  </div>
</body>
</html>
