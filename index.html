<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Use Archive - Coming Soon</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5MTMyMXwwfDF8c2VhcmNofDF8fHNrZXl8ZW58MHx8fHwxNjEyNzM4NTM4&ixlib=rb-4.0.3&q=80&w=1920') no-repeat center center/cover;
      color: #FFFFFF;
      padding: 20px;
      position: relative;
    }

    /* Optional dark overlay for readability */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
    }

    /* First line: afterusearchive.org */
    .site-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem; /* change '1.' to a relative rem or px value if needed */
      color: #FFF500;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* Second line: coming soon */
    .coming-soon {
      font-family: 'Oswald', sans-serif;
      font-size: 5.5rem; /* change '5.5' to rem value */
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* Paragraph */
    .description {
      font-family: 'Open Sans', sans-serif;
      font-size: 1rem;
      color: #FFFFFF;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Email icon */
    .email-link {
      color: #FFF500;
      font-size: 2rem;
      text-decoration: none;
      transition: color 0.3s;
    }

    .email-link:hover {
      color: #e6e600;
    }

    @media (max-width: 768px) {
      .coming-soon {
        font-size: 3.5rem;
      }

      .site-name, .description {
        font-size: 1rem;
      }

      .email-link {
        font-size: 1.5rem;
      }
    }
  </style>

  <!-- Font Awesome for email icon -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div class="site-name">afterusearchive.org</div>
    <div class="coming-soon">coming soon</div>
    <p class="description">
      After Use is a digital archive that serves to spotlight the voices of people in recovery by providing a voluntary space for storytelling to represent the social contexts of substance use and recovery.
    </p>
    <a href="mailto:madbrad38@gmail.com" class="email-link">
      <i class="fas fa-envelope"></i>
    </a>
  </div>
</body>
</html>
